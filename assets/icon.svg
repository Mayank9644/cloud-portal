<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Cloud Contour -->
  <path d="M176 352h176c44.18 0 80-35.82 80-80 0-40.89-30.72-74.62-70.36-79.35C355.8 141.44 309.43 104 256 104c-61.86 0-113.62 48.6-119.53 109.28C98.92 221.73 72 255.45 72 296c0 44.18 35.82 56 104 56z" fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Server Blades Inside Cloud -->
  <rect x="160" y="240" width="192" height="32" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="184" cy="256" r="6" fill="#38bdf8" />
  <circle cx="204" cy="256" r="6" fill="#34d399" />
  <line x1="230" y1="256" x2="330" y2="256" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />

  <rect x="160" y="288" width="192" height="32" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="184" cy="304" r="6" fill="#38bdf8" />
  <circle cx="204" cy="304" r="6" fill="#34d399" />
  <line x1="230" y1="304" x2="330" y2="304" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />

  <!-- Signal Pulse Waves -->
  <circle cx="256" cy="390" r="12" fill="url(#accentGrad)" filter="url(#glow)"/>
  <path d="M220 420c20 12 52 12 72 0" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M200 442c32 18 80 18 112 0" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
</svg>
