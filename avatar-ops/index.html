<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Redirecting to AvatarOps...</title>
  <style>body{background:#0b0f19;color:#f1f5f9;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}</style>
</head>
<body>
  <div id="msg">Connecting to AvatarOps 24/7 Cloud Tunnel...</div>
  <script>
    async function resolveAndRedirect() {
      const urls = [
        'https://raw.githubusercontent.com/Mayank9644/cloud-portal/main/endpoints.json?t=' + Date.now(),
        '../endpoints.json?t=' + Date.now()
      ];
      for (const u of urls) {
        try {
          const r = await fetch(u, { cache: 'no-store' });
          if (r.ok) {
            const d = await r.json();
            if (d.avatar_ops_url) {
              window.location.replace(d.avatar_ops_url);
              return;
            }
          }
        } catch (e) {}
      }
      document.getElementById('msg').innerHTML = 'Host tunnel restarting... <br><a href="../" style="color:#60a5fa;margin-top:10px;display:inline-block;">Return to Cloud Host Control</a>';
    }
    resolveAndRedirect();
  </script>
</body>
</html>
